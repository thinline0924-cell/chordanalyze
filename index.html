<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- head:start -->
<title>CHORD NOTE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="作曲のための早見帳。進行・ダイアトニック・コードの使い所・テンション・スケール。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&family=Noto+Music&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap">
<!-- head:end -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- body:start -->
<header class="hd" id="hd">
  <div class="wrap">
    <div class="hd-1">
      <a class="logo" href="#top">CHORD NOTE</a>
      <nav class="gnav" id="gnav" aria-label="ページ"></nav>
      <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="drawer">メニュー</button>
    </div>
    <div class="hd-2">
      <span class="lbl">Key</span>
      <div class="keys" id="keys" role="radiogroup" aria-label="キー"></div>
      <div class="search">
        <input id="q" type="search" placeholder="進行・コード・スケールを検索" autocomplete="off" aria-label="検索">
        <div class="results" id="qr" hidden></div>
      </div>
    </div>
  </div>
</header>

<main id="view" class="wrap"></main>

<aside class="panel" id="panel" hidden aria-label="コードの詳細"></aside>

<div class="drawer" id="drawer" hidden>
  <div class="dr-hd">
    <a class="logo" href="#top">CHORD NOTE</a>
    <button class="menu-btn" data-drawer-close>閉じる</button>
  </div>
  <div class="dr-search">
    <input id="q2" type="search" placeholder="進行・コード・スケールを検索" autocomplete="off" aria-label="検索">
    <div class="results" id="qr2" hidden></div>
  </div>
  <ul class="dr-nav" id="drNav"></ul>
</div>
<audio id="syncAudio" preload="auto" playsinline></audio>
<div id="ytDock"><div id="ytPlayer"></div></div>
<div class="pbar" id="pbar" aria-label="再生">
  <div class="pb-main">
    <button class="pb-play" data-sync-play aria-label="再生・一時停止"><i class="tri"></i></button>
    <div class="pb-chord"><b class="pb-now">—</b><span class="pb-next"></span></div>
    <button class="pb-tap" data-sync-tap>タップ</button>
  </div>
  <div class="pb-sub">
    <span class="pb-time">0:00 / 0:00</span>
    <input type="range" id="pbSeek" min="0" max="1" step="0.1" value="0" aria-label="再生位置">
    <div class="seg" role="group" aria-label="再生速度"><button data-sync-rate="0.5">0.5</button><button data-sync-rate="0.75">0.75</button><button data-sync-rate="1">1.0</button></div>
    <button class="lnk" data-sync-tapmode aria-pressed="false">タップで合わせる</button>
    <button class="lnk" data-sync-close>閉じる</button>
  </div>
</div>
<!-- body:end -->
<script src="js/theory.js"></script>
<script src="js/data.js"></script>
<script src="js/draw.js"></script>
<script src="js/sound.js"></script>
<script src="js/analyze.js"></script>
<script src="js/bookmarklet.js"></script>
<script src="js/audio.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
</body>
</html>
